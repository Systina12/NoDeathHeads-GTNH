name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      jar: ${{ steps.version.outputs.jar }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test the release JAR
        run: bash build/build.sh
      - name: Read the release version
        id: version
        run: |
          version=$(jq -er '.[0].version' src/main/resources/mcmod.info)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "jar=NoDeathHeads-GTNH-$version.jar" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: NoDeathHeads-GTNH
          path: build/dist/${{ steps.version.outputs.jar }}
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release-${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NoDeathHeads-GTNH
      - name: Publish a new version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          JAR: ${{ needs.build.outputs.jar }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$TAG" "$JAR" \
            --target "$GITHUB_SHA" \
            --title "No Death Heads $TAG — GTNH 2.9.0" \
            --notes "Server-side Forge 1.7.10 mod for GT New Horizons 2.9.0. Replaces each player death head generated by Tinkers' Construct with one cobblestone, so OpenBlocks graves can be collected normally even if the player died with an empty inventory. Replace the older JAR in the server's mods directory."
